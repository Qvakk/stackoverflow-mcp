services:
  stackoverflow-mcp:
    build: .
    environment:
      - STACK_EXCHANGE_API_KEY=${STACK_EXCHANGE_API_KEY}
      - MAX_REQUEST_PER_WINDOW=${MAX_REQUEST_PER_WINDOW:-30}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RETRY_AFTER_MS=${RETRY_AFTER_MS:-2000}
    stdin_open: true
    tty: true
